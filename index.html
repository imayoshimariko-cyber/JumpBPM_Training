<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メトロノーム・ジャンプ・トレーニング</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore-compat.js"></script>
    <style>
        @keyframes jump-up {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-120px) scale(1.1); }
        }
        .jumping {
            animation: jump-up 0.15s ease-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-white overflow-hidden font-sans select-none">

    <div id="app" class="relative w-full h-screen">
        <!-- ファイル入力 (非表示) -->
        <input type="file" id="charInput" accept="image/*" class="hidden">
        <input type="file" id="bgInput" accept="image/*" class="hidden">

        <!-- メッセージトースト -->
        <div id="toast" class="fixed top-24 left-1/2 -translate-x-1/2 z-[100] bg-indigo-600 px-6 py-3 rounded-full font-bold shadow-2xl transition-all opacity-0 translate-y-[-20px] pointer-events-none border border-indigo-400">
            メッセージ
        </div>

        <!-- 背景レイヤー: 右側カメラ映像 -->
        <div class="absolute top-0 right-0 w-1/2 h-full z-0 overflow-hidden bg-black">
            <video id="video" autoplay playsinline muted class="w-full h-full object-cover opacity-80" style="transform: scaleX(-1);"></video>
            <div class="absolute inset-0 bg-gradient-to-r from-slate-950 via-slate-950/20 to-transparent w-48 z-10"></div>
        </div>

        <!-- メインUIレイヤー -->
        <div class="relative z-20 w-full h-full flex flex-col">
            
            <!-- 上段: ステータスバー -->
            <div class="absolute top-4 left-0 right-0 flex items-center z-50 h-20 px-6">
                <div class="w-1/2 flex items-center justify-between pr-2">
                    <div class="flex items-center gap-2 pointer-events-auto">
                        <div class="bg-black/80 p-3 rounded-3xl border border-white/10 backdrop-blur-md shadow-2xl flex flex-col items-center min-w-[80px]">
                            <div class="text-blue-400 text-[10px] font-bold uppercase mb-1">BPM</div>
                            <div id="bpmDisplay" class="text-3xl font-black">100</div>
                        </div>
                        <button id="btnTriggerBg" class="bg-black/60 hover:bg-black/80 p-3 rounded-full border border-white/10 text-xl shadow-lg transition-transform active:scale-95" title="背景を変更">🌳</button>
                    </div>
                    <button id="btnTriggerChar" class="pointer-events-auto bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-full text-xs font-bold shadow-xl transition-all active:scale-95 flex items-center gap-2 border border-white/20">
                        <span>🖼️</span> <span id="charBtnText">キャラをえらぶ</span>
                    </button>
                </div>
                <div class="w-1/2 flex items-center justify-end">
                    <div class="bg-black/80 p-3 rounded-3xl border border-white/10 backdrop-blur-md min-w-[120px] shadow-2xl flex flex-col items-center">
                        <div class="text-yellow-400 text-[10px] font-bold uppercase mb-1">Jump</div>
                        <div id="jumpCountDisplay" class="text-3xl font-black">0</div>
                    </div>
                </div>
            </div>

            <!-- 中央コンテンツ -->
            <div class="flex-1 flex items-stretch justify-between overflow-hidden">
                <div class="w-1/2 relative flex items-end justify-center px-6 overflow-hidden bg-slate-900">
                    <img id="bgImg" src="IMG_3591.PNG" alt="Background" class="absolute inset-0 w-full h-full object-cover opacity-90 z-0">
                    <div class="absolute inset-0 bg-gradient-to-b from-black/30 via-transparent to-transparent z-10 pointer-events-none"></div>
                    
                    <div id="charArea" class="relative z-30 flex items-end justify-center w-full h-full pb-4">
                        <div id="charPlaceholder" class="cursor-pointer w-full max-w-[180px] aspect-square border-4 border-white/20 border-dashed rounded-[3rem] flex flex-col items-center justify-center bg-black/40 hover:bg-black/60 transition-colors mb-40 backdrop-blur-md shadow-2xl pointer-events-auto">
                            <div class="text-5xl mb-4 text-white/40">🖼️</div>
                            <p class="text-[10px] font-bold text-center px-4 text-white/70 leading-relaxed uppercase">キャラクターをえらぶ</p>
                        </div>
                        <img id="charImg" src="" alt="Character" class="hidden w-full max-w-[220px] h-auto object-contain transition-transform duration-100 ease-out drop-shadow-[0_20px_50px_rgba(0,0,0,0.9)] cursor-pointer pointer-events-auto">
                    </div>
                </div>

                <div id="guideArea" class="w-1/2 flex items-stretch justify-center px-4 pt-2">
                    <div class="w-full h-full border-4 border-yellow-400/40 border-dashed rounded-[3rem] flex flex-col items-center justify-start pt-24 bg-yellow-400/5 backdrop-blur-[1px] transition-opacity duration-300">
                        <div class="flex flex-col items-center text-center">
                            <div id="guideEmoji" class="text-[12rem] leading-none mb-6 transition-transform duration-150 filter drop-shadow-lg">👤</div>
                            <p class="text-yellow-400/60 text-2xl font-black leading-relaxed px-4">ここに うつって<br>いっしょに ジャンプ！</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 操作パネル -->
            <div class="absolute bottom-0 left-0 w-full p-8 z-[60] pointer-events-auto">
                <div class="max-w-md mx-auto space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <button id="btnStart" class="py-6 rounded-3xl text-3xl font-black shadow-[0_10px_40px_rgba(0,0,0,0.5)] border border-white/10 transition-all active:scale-95 bg-green-500 hover:bg-green-400 text-white">はじまる</button>
                        <button id="btnStop" disabled class="py-6 rounded-3xl text-3xl font-black shadow-[0_10px_40px_rgba(0,0,0,0.5)] border border-white/10 transition-all active:scale-95 bg-gray-800 text-gray-500 cursor-not-allowed">おわる</button>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <button id="btnFaster" class="bg-pink-500 hover:bg-pink-400 py-4 rounded-2xl text-xl font-bold shadow-[0_10px_30px_rgba(0,0,0,0.4)] active:scale-95 text-white border border-pink-400/30">はやく (+)</button>
                        <button id="btnSlower" class="bg-yellow-400 hover:bg-yellow-300 py-4 rounded-2xl text-xl font-bold shadow-[0_10px_30px_rgba(0,0,0,0.4)] active:scale-95 text-slate-900 border border-yellow-300/30">おそく (-)</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 結果モーダル -->
        <div id="resultModal" class="fixed inset-0 flex items-center justify-center z-[100] p-4 bg-black/60 backdrop-blur-sm hidden pointer-events-auto">
            <div class="bg-white text-black p-8 rounded-[3rem] shadow-2xl text-center border-[12px] border-yellow-400 max-w-md w-full animate-in zoom-in duration-200">
                <p class="text-2xl font-bold">トレーニング終了！</p>
                <div class="flex items-baseline justify-center gap-2 my-4">
                    <p id="finalCount" class="text-8xl font-black text-blue-600 leading-none">0</p>
                    <p class="text-xl font-bold">回</p>
                </div>
                
                <div class="bg-indigo-50 p-4 rounded-2xl mb-6 border border-indigo-100 text-left">
                    <p class="text-xs font-bold text-indigo-500 mb-1 uppercase">✨ AIアドバイス</p>
                    <div id="aiAdviceContent">
                        <button id="btnGetAdvice" class="w-full py-2 bg-indigo-600 text-white rounded-xl text-sm font-bold shadow-md hover:bg-indigo-500 transition-colors">✨ AIからメッセージをもらう</button>
                    </div>
                    <p id="aiAdviceText" class="hidden text-sm font-medium leading-relaxed text-slate-700"></p>
                    <div id="aiLoading" class="hidden text-sm text-indigo-400 animate-pulse italic">AIがアドバイスを考えています...</div>
                </div>

                <button id="btnCloseResult" class="w-full py-4 bg-gray-900 text-white rounded-2xl font-bold text-xl active:scale-95 transition-transform shadow-lg">とじる</button>
            </div>
        </div>
    </div>

    <script>
        // --- 設定・初期化 ---
        const apiKey = ""; 
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'jump-trainer-app';
        const firebaseConfig = JSON.parse(__firebase_config);
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 状態管理
        let state = {
            user: null,
            isActive: false,
            bpm: 100,
            count: 0,
            isJumping: false,
            imgSrc: null,
            bgSrc: "IMG_3591.PNG",
            isSaving: false,
            isSynced: false
        };

        const elements = {
            video: document.getElementById('video'),
            charInput: document.getElementById('charInput'),
            bgInput: document.getElementById('bgInput'),
            bpmDisplay: document.getElementById('bpmDisplay'),
            jumpCountDisplay: document.getElementById('jumpCountDisplay'),
            charImg: document.getElementById('charImg'),
            bgImg: document.getElementById('bgImg'),
            charPlaceholder: document.getElementById('charPlaceholder'),
            btnStart: document.getElementById('btnStart'),
            btnStop: document.getElementById('btnStop'),
            btnFaster: document.getElementById('btnFaster'),
            btnSlower: document.getElementById('btnSlower'),
            btnTriggerChar: document.getElementById('btnTriggerChar'),
            btnTriggerBg: document.getElementById('btnTriggerBg'),
            charBtnText: document.getElementById('charBtnText'),
            guideArea: document.getElementById('guideArea'),
            guideEmoji: document.getElementById('guideEmoji'),
            resultModal: document.getElementById('resultModal'),
            finalCount: document.getElementById('finalCount'),
            btnGetAdvice: document.getElementById('btnGetAdvice'),
            aiAdviceText: document.getElementById('aiAdviceText'),
            aiLoading: document.getElementById('aiLoading'),
            btnCloseResult: document.getElementById('btnCloseResult'),
            toast: document.getElementById('toast')
        };

        // --- Firebase Auth (Rule 3) ---
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await auth.signInWithCustomToken(__initial_auth_token);
                } else {
                    await auth.signInAnonymously();
                }
            } catch (err) {
                console.error("Auth error:", err);
            }
        }

        // --- Firestore Sync (Rule 1 & 3) ---
        function syncFirestore() {
            if (!state.user || state.isSynced) return;
            state.isSynced = true;

            const docRef = db.collection('artifacts').doc(appId).collection('users').doc(state.user.uid).collection('settings').doc('character');
            
            docRef.onSnapshot(doc => {
                if (doc.exists) {
                    const data = doc.data();
                    if (data.imageBase64) {
                        state.imgSrc = data.imageBase64;
                        elements.charImg.src = data.imageBase64;
                        elements.charImg.classList.remove('hidden');
                        elements.charPlaceholder.classList.add('hidden');
                        elements.charBtnText.textContent = "キャラ変更";
                    }
                    if (data.bgBase64) {
                        state.bgSrc = data.bgBase64;
                        elements.bgImg.src = data.bgBase64;
                    }
                }
            }, err => {
                console.error("Firestore sync error:", err);
                state.isSynced = false; // Retry potential
            });
        }

        // --- カメラ & オーディオ ---
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                elements.video.srcObject = stream;
            } catch (err) {
                console.error("Camera error:", err);
            }
        }

        let audioCtx = null;
        let nextNoteTime = 0;
        let timerID = null;

        function playClick(time) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const envelope = audioCtx.createGain();
            osc.frequency.value = 1000;
            envelope.gain.value = 0.4;
            envelope.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
            osc.connect(envelope);
            envelope.connect(audioCtx.destination);
            osc.start(time);
            osc.stop(time + 0.05);
        }

        function scheduler() {
            if (!state.isActive) return;
            while (nextNoteTime < audioCtx.currentTime + 0.1) {
                playClick(nextNoteTime);
                const delay = (nextNoteTime - audioCtx.currentTime) * 1000;
                setTimeout(() => {
                    doJump();
                }, Math.max(0, delay));
                nextNoteTime += 60.0 / state.bpm;
            }
            timerID = setTimeout(scheduler, 25);
        }

        function doJump() {
            if (!state.isActive) return;
            state.count++;
            elements.jumpCountDisplay.textContent = state.count;
            elements.charImg.classList.add('jumping');
            elements.guideEmoji.classList.add('jumping');
            setTimeout(() => {
                elements.charImg.classList.remove('jumping');
                elements.guideEmoji.classList.remove('jumping');
            }, 150);
        }

        // --- Gemini AI ---
        function pcmToWav(pcmData, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcmData.length * 2);
            const view = new DataView(buffer);
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
            };
            writeString(0, 'RIFF');
            view.setUint32(4, 32 + pcmData.length * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, pcmData.length * 2, true);
            for (let i = 0; i < pcmData.length; i++) view.setInt16(44 + i * 2, pcmData[i], true);
            return new Blob([view], { type: 'audio/wav' });
        }

        async function speak(text) {
            if (!apiKey) return;
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Aoede" } } }
                        },
                        model: "gemini-2.5-flash-preview-tts"
                    })
                });
                const result = await response.json();
                const audioData = result.candidates[0].content.parts[0].inlineData.data;
                const sampleRate = parseInt(result.candidates[0].content.parts[0].inlineData.mimeType.match(/rate=(\d+)/)[1]);
                const binaryString = atob(audioData);
                const pcm = new Int16Array(binaryString.length / 2);
                for (let i = 0; i < pcm.length; i++) {
                    pcm[i] = (binaryString.charCodeAt(i * 2 + 1) << 8) | binaryString.charCodeAt(i * 2);
                }
                const wavBlob = pcmToWav(pcm, sampleRate);
                const audio = new Audio(URL.createObjectURL(wavBlob));
                audio.play();
            } catch (err) { console.error("TTS Error:", err); }
        }

        async function fetchAdvice() {
            elements.btnGetAdvice.classList.add('hidden');
            elements.aiLoading.classList.remove('hidden');
            const prompt = `ジャンプトレーニング結果: ${state.count}回、テンポ${state.bpm}BPM。元気づける日本語メッセージを120文字以内で作成してください。`;
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text || "素晴らしいジャンプでした！";
                elements.aiAdviceText.textContent = text;
                elements.aiAdviceText.classList.remove('hidden');
                speak(text);
            } catch (err) {
                console.error("AI Error:", err);
                elements.aiAdviceText.textContent = "素晴らしい努力です！次も頑張りましょう！";
                elements.aiAdviceText.classList.remove('hidden');
            } finally {
                elements.aiLoading.classList.add('hidden');
            }
        }

        // --- ユーティリティ ---
        function showToast(msg) {
            elements.toast.textContent = msg;
            elements.toast.style.opacity = "1";
            elements.toast.style.transform = "translate(-50%, 0)";
            setTimeout(() => {
                elements.toast.style.opacity = "0";
                elements.toast.style.transform = "translate(-50%, -20px)";
            }, 3000);
        }

        async function processAndSaveImage(file, type) {
            if (!state.user) return;
            state.isSaving = true;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    const maxDim = 512;
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > maxDim) { height *= maxDim / width; width = maxDim; } }
                    else { if (height > maxDim) { width *= maxDim / height; height = maxDim; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const base64Data = canvas.toDataURL('image/png', 0.7);
                    
                    if (base64Data.length > 1048576) {
                        showToast("画像が大きすぎます");
                        state.isSaving = false; return;
                    }
                    try {
                        const docRef = db.collection('artifacts').doc(appId).collection('users').doc(state.user.uid).collection('settings').doc('character');
                        const updateData = type === 'char' ? { imageBase64: base64Data } : { bgBase64: base64Data };
                        await docRef.set({ ...updateData, updatedAt: Date.now() }, { merge: true });
                    } catch (err) { console.error("Save error:", err); }
                    finally { state.isSaving = false; }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // --- ブートストラップ ---
        async function startApp() {
            await startCamera();
            await initAuth();
            
            auth.onAuthStateChanged(user => {
                state.user = user;
                if (user) syncFirestore();
            });
        }

        // --- イベントリスナー ---
        elements.btnStart.onclick = () => {
            if (!state.imgSrc) { showToast("先にキャラを選んでね！"); return; }
            state.isActive = true;
            state.count = 0;
            elements.jumpCountDisplay.textContent = "0";
            elements.btnStart.disabled = true;
            elements.btnStart.classList.add('bg-gray-800', 'text-gray-500', 'cursor-not-allowed');
            elements.btnStop.disabled = false;
            elements.btnStop.classList.remove('bg-gray-800', 'text-gray-500', 'cursor-not-allowed');
            elements.btnStop.classList.add('bg-red-500', 'text-white');
            elements.guideArea.style.opacity = "0";
            
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            nextNoteTime = audioCtx.currentTime;
            scheduler();
            speak("トレーニング開始！リズムに合わせてジャンプ！");
        };

        elements.btnStop.onclick = () => {
            state.isActive = false;
            clearTimeout(timerID);
            elements.btnStart.disabled = false;
            elements.btnStart.classList.remove('bg-gray-800', 'text-gray-500', 'cursor-not-allowed');
            elements.btnStop.disabled = true;
            elements.btnStop.classList.add('bg-gray-800', 'text-gray-500', 'cursor-not-allowed');
            elements.guideArea.style.opacity = "1";
            
            elements.finalCount.textContent = state.count;
            elements.aiAdviceText.classList.add('hidden');
            elements.btnGetAdvice.classList.remove('hidden');
            elements.resultModal.classList.remove('hidden');
            speak("お疲れ様でした！");
        };

        elements.btnFaster.onclick = () => {
            state.bpm = Math.min(240, state.bpm + 10);
            elements.bpmDisplay.textContent = state.bpm;
        };
        elements.btnSlower.onclick = () => {
            state.bpm = Math.max(40, state.bpm - 10);
            elements.bpmDisplay.textContent = state.bpm;
        };

        elements.btnTriggerChar.onclick = () => elements.charInput.click();
        elements.charPlaceholder.onclick = () => elements.charInput.click();
        elements.charImg.onclick = () => elements.charInput.click();
        elements.btnTriggerBg.onclick = () => elements.bgInput.click();

        elements.charInput.onchange = (e) => processAndSaveImage(e.target.files[0], 'char');
        elements.bgInput.onchange = (e) => processAndSaveImage(e.target.files[0], 'bg');

        elements.btnGetAdvice.onclick = fetchAdvice;
        elements.btnCloseResult.onclick = () => elements.resultModal.classList.add('hidden');

        // 実行開始
        startApp();
    </script>
</body>
</html>
